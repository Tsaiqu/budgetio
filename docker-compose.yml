services:
  db:
    image: postgres:17-alpine
    container_name: budgetio-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-budgetio}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-budgetio}
      POSTGRES_DB: ${POSTGRES_DB:-budgetio}
    ports:
      # port hosta z .env — pozwala uniknąć kolizji z lokalnym Postgresem
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - budgetio-db-data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'pg_isready -U ${POSTGRES_USER:-budgetio} -d ${POSTGRES_DB:-budgetio}',
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  budgetio-db-data:
